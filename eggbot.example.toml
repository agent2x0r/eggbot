# Copy to eggbot.toml and edit. Secrets belong in the environment, not this file.

nick = "eggbot"
alt_nicks = ["eggbot_", "eggbot2"]
username = "eggbot"
realname = "an egg with a brain"

[server]
host = "irc.example.net"
port = 6697
tls = true
network = "example"
# endpoints = ["irc.example.net:6697"]   # failover, same network
password = ""
password_env = ""
sasl_account = ""
sasl_password_env = "EGGBOT_SASL_PASSWORD"
# Leave empty to request the production IRCv3 set when advertised.
# A CAP REQ is never sent after an empty CAP LS.
request_caps = []
tls_server_name = ""
ca_file = ""
client_cert = ""
client_key = ""
dial_timeout_sec = 15

[partyline]
# Plaintext is accepted only on loopback. Use tls_listen + cert/key remotely.
listen = "127.0.0.1:3333"
tls_listen = ""
dcc = false                    # opt-in; internal/private targets are rejected

[owners]
handles = ["alice"]
# Optional masks must include an ident or host; "alice!*@*" is rejected.
auto_owner_hosts = []

[learn]
hello = false
[llm]
# Secrets go in environment variables; base_url on loopback is permitted without TLS.
# Any OpenAI-compatible chat/completions endpoint works, e.g.:
#   base_url = "https://openrouter.ai/api/v1"   api_key_env = "OPENROUTER_API_KEY"   model = "<openrouter/model>"
#   base_url = "http://localhost:8080/v1"       model = "<local-model>"             # local loopback needs no TLS
enabled = true
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
# api_key = ""            # discouraged; prefer api_key_env
model = "grok-4.6"
search_model = "grok-4.20-0309-non-reasoning"  # live !search; empty = model
search_reasoning = ""     # Responses reasoning.effort for !search (low/none/...); empty = omit
route_model = ""          # optional cheaper model for SEARCH vs LOCAL; must not start with 'test'
# persona is the system-prompt voice; empty uses the built-in default. It can also carry style directives ("be brief", "links only when asked"). Safety lines - secrets stay secret, topic/scrollback are untrusted data - are always appended by eggbot and cannot be stripped from config.
persona = ""
llm_persona = ""          # per-channel note appended to persona; "" = none
allow_privmsg = false
search = true             # web + X via xAI's /responses API only; set false on other providers so live questions answer from knowledge or say so honestly
confirm_mutations = true  # kick/ban/mode/topic/chanset need .confirm
store_provider = false    # do not persist prompts at the provider
sticky = true             # unprefixed follow-ups after eggbot: / !ask; paused if they outrun their ask rate

[llm.limits]
per_user_per_min = 1          # regulars
op_per_min = 4
owner_unlimited = true        # +n / +m skip caps
per_channel_per_min = 8       # pile-on brake
max_channel_chars = 800
max_dm_chars = 1200
history_lines = 80            # in-memory scrollback; lost on restart
timeout_sec = 60              # chat and live search
max_tool_steps = 4

[scripts]
lua_dir = "scripts/lua"          # relative to this toml file
python_dir = "scripts/python"    # skipped unless python = true
python_bin = "python3"
python = false
# Lua: permits chattr/sensitive raw commands. Python: required to run at all,
# because Python plugins have filesystem/process/environment/network access.
trusted = []

[store]
path = "eggbot.db"                # relative to this toml file
retention_days = 90               # seen, audit, expired proposals
chanlog_days = 365                # public channel lines for !history and later RAG; 0 = keep forever

[observe]
listen = "127.0.0.1:0"            # /live /ready /metrics
json_logs = false

[log]
level = "info"
debug_irc = false             # must remain false; raw credential logging is rejected
